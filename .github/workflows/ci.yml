name: ci

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Tests
        run: bundle exec rake test

  publish:
    name: Publish to RubyGems.org
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure RubyGems Trusted Publisher
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0

      - name: Build gem
        run: gem build pinnacle.gemspec

      - name: Publish gem
        # RubyGems uses version-string semantics for pre-releases — a
        # version like `2.0.16.pre.rc.1` is automatically hidden from
        # `gem install rcs` and only installs via `gem install rcs --pre`
        # or an explicit `--version 2.0.16.pre.rc.1`. No dist-tag flag is
        # needed here; `gem push` is identical for stable and pre-release
        # tags. We just log which variant we're publishing.
        run: |
          if [[ ${GITHUB_REF} == *rc* ]]; then
            echo "Publishing pre-release (RC) — RubyGems will hide from plain 'gem install rcs'"
          elif [[ ${GITHUB_REF} == *alpha* ]]; then
            echo "Publishing pre-release (alpha)"
          elif [[ ${GITHUB_REF} == *beta* ]]; then
            echo "Publishing pre-release (beta)"
          else
            echo "Publishing stable release"
          fi
          gem push *.gem
